<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Gift picks by type of person">
<rect width="1200" height="620" fill="#faf7f1"/>
<text x="50" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#25453a">Pick by person</text><text x="50" y="132" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6b7a72">Three simple routes when you are not sure what to buy</text><g transform="translate(50 180)"><rect width="346" height="380" rx="26" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="346" height="72" rx="26" fill="#5f8f7a"/><rect y="44" width="346" height="28" fill="#5f8f7a"/><text x="173" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">The curious beginner</text><text x="173" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#25453a">Facial Cupping Starter Kit</text><text x="173" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#5f8f7a">$92</text><text x="173" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">Cups, 30ml oil and an online</text><text x="173" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">tutorial. Add the $5 kraft gift</text><text x="173" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">box to wrap it.</text></g><g transform="translate(424 180)"><rect width="346" height="380" rx="26" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="346" height="72" rx="26" fill="#c9867a"/><rect y="44" width="346" height="28" fill="#c9867a"/><text x="173" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">The ritual lover</text><text x="173" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#25453a">Dry brush + clay mask kit</text><text x="173" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#c9867a">$38 + $52</text><text x="173" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">A body brush for the morning and a</text><text x="173" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">mask kit with bowl, spoon and</text><text x="173" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">brush for the evening.</text></g><g transform="translate(798 180)"><rect width="346" height="380" rx="26" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="346" height="72" rx="26" fill="#25453a"/><rect y="44" width="346" height="28" fill="#25453a"/><text x="173" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">The one who has everything</text><text x="173" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#25453a">E-Gift Card</text><text x="173" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#25453a">from $15</text><text x="173" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">Lets them choose. Values are</text><text x="173" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">listed as £10, £25, £50, £100 and</text><text x="173" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7a72">£200.</text></g>
</svg>
