<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Sample daily ritual">
<rect width="1200" height="620" fill="#faf7f1"/>
<text x="50" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#25453a">A sample day with these tools</text><text x="50" y="122" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6b7a72">Our own suggestion, not the brand's protocol. Use only what you need.</text><g transform="translate(50 190)"><rect width="206" height="300" rx="22" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="206" height="58" rx="22" fill="#c9a45a"/><rect y="30" width="206" height="28" fill="#c9a45a"/><text x="103" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Morning</text><text x="103" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#25453a">Dry brush</text><text x="103" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">Invigorating or</text><text x="103" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">Balancing Body Brush</text><text x="103" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">before a shower</text></g><g transform="translate(276 190)"><rect width="206" height="300" rx="22" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="206" height="58" rx="22" fill="#5f8f7a"/><rect y="30" width="206" height="28" fill="#5f8f7a"/><text x="103" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Shower</text><text x="103" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#25453a">Natural deodorant</text><text x="103" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">After drying, a</text><text x="103" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">pea-sized amount of</text><text x="103" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">balm</text></g><g transform="translate(502 190)"><rect width="206" height="300" rx="22" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="206" height="58" rx="22" fill="#c9867a"/><rect y="30" width="206" height="28" fill="#c9867a"/><text x="103" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Evening</text><text x="103" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#25453a">Clay mask</text><text x="103" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">Mix the powder, apply</text><text x="103" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">with the brush, rinse</text><text x="103" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">off</text></g><g transform="translate(728 190)"><rect width="206" height="300" rx="22" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="206" height="58" rx="22" fill="#5f8f7a"/><rect y="30" width="206" height="28" fill="#5f8f7a"/><text x="103" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Wind down</text><text x="103" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#25453a">Facial or body cup</text><text x="103" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">A few gentle minutes</text><text x="103" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">with oil, then the</text><text x="103" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">headband off</text></g><g transform="translate(954 190)"><rect width="206" height="300" rx="22" fill="#fff" stroke="#d7dcd6" stroke-width="2"/><rect width="206" height="58" rx="22" fill="#25453a"/><rect y="30" width="206" height="28" fill="#25453a"/><text x="103" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Bedtime</text><text x="103" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#25453a">Silk &amp; aroma</text><text x="103" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">Silk pillowcase and a</text><text x="103" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">roll-on at pulse</text><text x="103" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6b7a72">points</text></g>
</svg>
