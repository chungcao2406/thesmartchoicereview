<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Three gifting routes">
<rect width="1200" height="600" fill="#fbf6ee"/><text x="60" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1f4d33">Pick by occasion</text><text x="60" y="135" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6b7f72">Three simple gifting routes</text><g transform="translate(60 180)"><rect width="340" height="360" rx="26" fill="#fff" stroke="#d5cfc2" stroke-width="2"/><rect width="340" height="72" rx="26" fill="#8a5a44"/><rect y="42" width="340" height="30" fill="#8a5a44"/><text x="170" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">For a cosy gift</text><text x="170" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1f4d33">Pandoro Dream line</text><text x="170" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#8a5a44">€14.25 and €10.50</text></g><text x="230" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">Body cream and shower gel with</text><text x="230" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">a dark chocolate, cocoa and</text><text x="230" y="498" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">icing sugar scent</text><g transform="translate(428 180)"><rect width="340" height="360" rx="26" fill="#fff" stroke="#d5cfc2" stroke-width="2"/><rect width="340" height="72" rx="26" fill="#3a9d9a"/><rect y="42" width="340" height="30" fill="#3a9d9a"/><text x="170" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">For everyday use</text><text x="170" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1f4d33">Hand cream</text><text x="170" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#3a9d9a">€6.30</text></g><text x="598" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">Shea butter, urea and</text><text x="598" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">allantoin for cold-weather dry</text><text x="598" y="498" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">hands</text><g transform="translate(796 180)"><rect width="340" height="360" rx="26" fill="#fff" stroke="#d5cfc2" stroke-width="2"/><rect width="340" height="72" rx="26" fill="#c24a4a"/><rect y="42" width="340" height="30" fill="#c24a4a"/><text x="170" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">For a bigger spend</text><text x="170" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1f4d33">Dream Box</text><text x="170" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#c24a4a">€59</text></g><text x="966" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">Pick your own products inside</text><text x="966" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7f72">a members-only box</text>
