<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Four kinds of East Perry items used at home with starting prices">
<rect width="1200" height="520" fill="#fbf8f3"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#3b2f26">What is in our house</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#7a6e62">Four kinds of East Perry items we use, with the lowest listed price we found for each</text><g transform="translate(50 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#a07a52"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">Slippers</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#a07a52">From $99</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">The Classic and</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">the Terra are</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">both listed at</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">$99.</text></g><g transform="translate(329 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#7d8f72"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">Sheepskin pelts</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7d8f72">From $159</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Small nursery</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">pelts start at</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">$159; larger ones</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">cost more.</text></g><g transform="translate(608 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#b8776a"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">Hot water bottle</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b8776a">$109</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">The Sheepskin Hot</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Water Bottle</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Warmer.</text></g><g transform="translate(887 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#3e4f66"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">Pillow</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#3e4f66">From $99</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Pillowcases start</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">at $99; the Neck</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Support Pillow is</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">$149.</text></g>
</svg>
