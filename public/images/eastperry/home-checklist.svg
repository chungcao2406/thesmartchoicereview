<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Four checks before buying sheepskin">
<rect width="1200" height="520" fill="#fbf8f3"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#3b2f26">Four checks before you buy</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#7a6e62">Our own checklist, not a rule from the shop</text><g transform="translate(50 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#b8776a"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">1. Allergies</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b8776a">Wool and lanolin</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Sheepskin is an</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">animal product.</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Skip it if anyone</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">at home reacts to</text><text x="28" y="266" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">wool.</text></g><g transform="translate(329 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#3e4f66"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">2. Baby sleep</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#3e4f66">Keep it out</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Keep soft items</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">out of a baby’s</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">sleep space and</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">ask a</text><text x="28" y="266" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">paediatrician.</text></g><g transform="translate(608 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#7d8f72"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">3. Size, returns</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7d8f72">Read first</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Check the size</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">notes and the</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">return terms for</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">your exact item.</text></g><g transform="translate(887 160)"><rect width="263" height="300" rx="22" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="263" height="10" rx="5" fill="#a07a52"/><text x="28" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#3b2f26">4. Total cost</text><text x="28" y="102" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#a07a52">Look at shipping</text><text x="28" y="146" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">Add shipping and</text><text x="28" y="176" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">check whether a</text><text x="28" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">sale or free-gift</text><text x="28" y="236" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f2923">line applies.</text></g>
</svg>
