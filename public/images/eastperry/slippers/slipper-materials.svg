<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" role="img" aria-label="Four East Perry slipper models with prices and materials">
<rect width="1200" height="628" fill="#fbf8f3"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#3b2f26">What the shop says each model is made of</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#7a6e62">Taken from the product pages, listed prices when we checked</text><g transform="translate(50 160)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="330" height="94" rx="18" fill="#a07a52"/><text x="26" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff">The Classic Slipper</text><text x="26" y="75" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">$99</text><text x="362" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">Natural sheepskin upper with an EVA foam sole, a synthetic</text><text x="362" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">material.</text></g><g transform="translate(50 272)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="330" height="94" rx="18" fill="#7d8f72"/><text x="26" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff">Terra Slipper</text><text x="26" y="75" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">$99</text><text x="362" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">Described as the “no rubber sole” slipper, 100% natural</text><text x="362" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">sheepskin.</text></g><g transform="translate(50 384)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="330" height="94" rx="18" fill="#b8776a"/><text x="26" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff">The Everyday Slip-On</text><text x="26" y="75" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">$119</text><text x="362" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">100% natural shearling sheepskin with a thick leather or</text><text x="362" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">suede bottom.</text></g><g transform="translate(50 496)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#e0d6c8" stroke-width="2"/><rect width="330" height="94" rx="18" fill="#3e4f66"/><text x="26" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff">Extra Warm Booties</text><text x="26" y="75" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">$149</text><text x="362" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">100% sheepskin, with leather as the sole and fur padding</text><text x="362" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#2f2923">inside.</text></g>
</svg>
