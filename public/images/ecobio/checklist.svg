<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Pre-purchase checklist">
<rect width="1200" height="640" fill="#fbf8f1"/><text x="60" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1f4d33">Before you buy: a short checklist</text><text x="60" y="135" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#6b7f72">Four things worth knowing before you place an order</text><g transform="translate(60 180)"><rect width="1080" height="84" rx="20" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><circle cx="52" cy="42" r="26" fill="#2f7d4f"/><path d="M40 43 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#27352c">Sale prices are promotional and will change when Black Month ends</text></g><g transform="translate(60 285)"><rect width="1080" height="84" rx="20" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><circle cx="52" cy="42" r="26" fill="#2f7d4f"/><path d="M40 43 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#27352c">The brand’s cosmetic claims are its own, and results vary</text></g><g transform="translate(60 390)"><rect width="1080" height="84" rx="20" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><circle cx="52" cy="42" r="26" fill="#2f7d4f"/><path d="M40 43 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#27352c">Patch-test new products, especially actives and fragrance</text></g><g transform="translate(60 495)"><rect width="1080" height="84" rx="20" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><circle cx="52" cy="42" r="26" fill="#2f7d4f"/><path d="M40 43 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#27352c">The shop is in Italian, so check shipping and returns for your country</text></g>
</svg>
