<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="Five situations and what to look at for each">
<rect width="1200" height="740" fill="#f6f8f9"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2f3b45">Start from your situation</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7782">General rules of thumb, not test results</text><g transform="translate(50 160)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="320" height="94" rx="18" fill="#6b8798"/><text x="28" y="57" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#fff">Small car trunk</text><text x="350" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">Look at the folded size and weight first. Compact and travel</text><text x="350" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">types are the usual place to start.</text></g><g transform="translate(50 272)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="320" height="94" rx="18" fill="#7d9a85"/><text x="28" y="57" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#fff">Long daily walks</text><text x="350" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">Look at wheels, seat comfort and handle height. Mid-size and</text><text x="350" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">full-size types are common choices.</text></g><g transform="translate(50 384)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="320" height="94" rx="18" fill="#b8776a"/><text x="28" y="57" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#fff">Running</text><text x="350" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">Look for a stroller made for running and check the maker’s</text><text x="350" y="68" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">minimum age.</text></g><g transform="translate(50 496)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="320" height="94" rx="18" fill="#b79a6b"/><text x="28" y="57" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#fff">Rough paths</text><text x="350" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">Look at an all-terrain type with larger wheels and suspension.</text></g><g transform="translate(50 608)"><rect width="1100" height="94" rx="18" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="320" height="94" rx="18" fill="#2f3b45"/><text x="28" y="57" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#fff">A second child coming</text><text x="350" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#26303a">Look at a single-to-double type that can grow with the family.</text></g>
</svg>
