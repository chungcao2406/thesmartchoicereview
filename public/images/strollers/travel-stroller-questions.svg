<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Five questions to ask about any travel stroller">
<rect width="1200" height="520" fill="#f6f8f9"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2f3b45">Five questions for any travel stroller</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7782">Our own checklist, inspired by the notes above.</text><g transform="translate(50 160)"><rect width="208.8" height="320" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#6b8798"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">1. Fold and</text><text x="18" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">carry</text><text x="18" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">How does it fold</text><text x="18" y="178" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">and carry? Can</text><text x="18" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">you do it with</text><text x="18" y="234" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">one hand?</text></g><g transform="translate(272.8 160)"><rect width="208.8" height="320" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#7d9a85"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">2. Recline and</text><text x="18" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">age</text><text x="18" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Does the seat</text><text x="18" y="178" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">recline, and what</text><text x="18" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">is the maker’s</text><text x="18" y="234" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">minimum age?</text></g><g transform="translate(495.6 160)"><rect width="208.8" height="320" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#b8776a"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">3. Basket</text><text x="18" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">What does the</text><text x="18" y="178" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">basket hold, and</text><text x="18" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">is that enough</text><text x="18" y="234" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">for your trips?</text></g><g transform="translate(718.4000000000001 160)"><rect width="208.8" height="320" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#b79a6b"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">4. Small parts</text><text x="18" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Do parts like the</text><text x="18" y="178" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">footrest stay in</text><text x="18" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">place in daily</text><text x="18" y="234" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">use?</text></g><g transform="translate(941.2 160)"><rect width="208.8" height="320" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#2f3b45"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">5. Your</text><text x="18" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">surfaces</text><text x="18" y="150" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Will the wheels</text><text x="18" y="178" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">cope with the</text><text x="18" y="206" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">pavements you</text><text x="18" y="234" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">really use?</text></g>
</svg>
