<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Five questions to ask about any diaper bag: carry, stroller fit, pockets, clean-up, size">
<rect width="1200" height="540" fill="#f6f8f9"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2f3b45">Five questions for any diaper bag</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7782">Our own checklist, inspired by the video.</text><g transform="translate(50 160)"><rect width="208.8" height="340" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#6b8798"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">1. How you</text><text x="18" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">carry</text><text x="18" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Backpack or tote?</text><text x="18" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Try it with the</text><text x="18" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">weight you will</text><text x="18" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">really carry.</text></g><g transform="translate(272.8 160)"><rect width="208.8" height="340" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#7d9a85"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">2. Stroller</text><text x="18" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">fit</text><text x="18" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Does it sit in</text><text x="18" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">the basket or</text><text x="18" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">hang on the</text><text x="18" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">handles? Check</text><text x="18" y="242" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">the stroller</text><text x="18" y="270" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">maker’s limit.</text></g><g transform="translate(495.6 160)"><rect width="208.8" height="340" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#b8776a"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">3. Pockets</text><text x="18" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Can you reach</text><text x="18" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">wipes and a nappy</text><text x="18" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">with one hand?</text></g><g transform="translate(718.4000000000001 160)"><rect width="208.8" height="340" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#b79a6b"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">4. Clean-up</text><text x="18" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Is the lining</text><text x="18" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">easy to wipe when</text><text x="18" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">something leaks?</text></g><g transform="translate(941.2 160)"><rect width="208.8" height="340" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#2f3b45"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">5. Real size</text><text x="18" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">Pack what you</text><text x="18" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">carry: changing</text><text x="18" y="186" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">mat, bottles,</text><text x="18" y="214" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6b7782">spare clothes.</text></g>
</svg>
