<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Five questions before buying a stroller">
<rect width="1200" height="520" fill="#f6f8f9"/>
<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2f3b45">Five questions before you buy</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7782">Our own checklist, not from the reviewer</text><g transform="translate(50 160)"><rect width="208.8" height="300" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#6b8798"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">1. Your car</text><text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">Measure the</text><text x="18" y="142" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">trunk and check</text><text x="18" y="172" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">the folded size.</text></g><g transform="translate(272.8 160)"><rect width="208.8" height="300" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#7d9a85"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">2. Your routine</text><text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">Think about</text><text x="18" y="142" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">daily walks,</text><text x="18" y="172" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">errands and</text><text x="18" y="202" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">trips.</text></g><g transform="translate(495.6 160)"><rect width="208.8" height="300" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#b8776a"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">3. Your lifting</text><text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">Check the</text><text x="18" y="142" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">weight, since</text><text x="18" y="172" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">you will carry</text><text x="18" y="202" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">it.</text></g><g transform="translate(718.4000000000001 160)"><rect width="208.8" height="300" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#b79a6b"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">4. Your family</text><text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">One child now,</text><text x="18" y="142" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">or a second one</text><text x="18" y="172" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">soon?</text></g><g transform="translate(941.2 160)"><rect width="208.8" height="300" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="208.8" height="10" rx="5" fill="#2f3b45"/><text x="18" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2f3b45">5. Your budget</text><text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">Add accessories,</text><text x="18" y="142" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">and check</text><text x="18" y="172" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">recalls and age</text><text x="18" y="202" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#26303a">limits.</text></g>
</svg>
