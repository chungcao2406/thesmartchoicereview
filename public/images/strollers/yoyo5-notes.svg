<text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2f3b45">Stokke YOYO5: the on-screen notes</text><text x="50" y="116" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#6b7782">From a reviewer's short video. Our summary of her labels, not a test of our own.</text><g transform="translate(50 150)"><rect width="540" height="516" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="540" height="56" rx="20" fill="#7d9a85"/><rect y="30" width="540" height="26" fill="#7d9a85"/><text x="24" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff">Features she points out</text><g transform="translate(18 72)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#7d9a85"/><text x="52" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">One-handed fold</text></g><g transform="translate(18 160)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#7d9a85"/><text x="52" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Carry strap</text></g><g transform="translate(18 248)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#7d9a85"/><text x="52" y="34" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Cafe Mode (shown parked by a</text><text x="52" y="62" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">table)</text></g><g transform="translate(18 336)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#7d9a85"/><text x="52" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Easy buckles</text></g><g transform="translate(18 424)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#7d9a85"/><text x="52" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Mesh for airflow</text></g></g><g transform="translate(630 150)"><rect width="540" height="428" rx="20" fill="#fff" stroke="#d9e0e5" stroke-width="2"/><rect width="540" height="56" rx="20" fill="#b8776a"/><rect y="30" width="540" height="26" fill="#b8776a"/><text x="24" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#fff">Trade-offs she flags</text><g transform="translate(18 72)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#b8776a"/><text x="52" y="34" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Reclining the seat needs a manual</text><text x="52" y="62" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">rethread</text></g><g transform="translate(18 160)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#b8776a"/><text x="52" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Included footrest falls easily</text></g><g transform="translate(18 248)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#b8776a"/><text x="52" y="46" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">No newborn recline</text></g><g transform="translate(18 336)"><rect width="504" height="78" rx="14" fill="#f6f8f9"/><circle cx="24" cy="39" r="7" fill="#b8776a"/><text x="52" y="34" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">Small basket, holds 22 lbs (about</text><text x="52" y="62" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2f3b45">10 kg)</text></g></g><text x="50" y="720" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#6b7782">She says the full review is longer. Watch it for the detail behind each note.</text>
